{% extends "base.html" %}
{% block content %}

<section>
  <h2>Login</h2>
  <form method="post" action="{{ url_for('login') }}">
    <input name="username" placeholder="username" required>
    <input name="password" type="password" placeholder="password" required>
    <button type="submit">Login</button>
  </form>
  <p class="msg">no account? create a test one:
    <a href="{{ url_for('temp_add_user') }}">cadet</a> or
    <a href="{{ url_for('temp_add_user', role='command_officer') }}">command officer</a>
    (testcadet / testofficer, password testpassword)</p>
</section>

{% endblock %}
