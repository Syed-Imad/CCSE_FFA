<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IMS</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; color: #222; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1rem; margin-top: 2rem; border-bottom: 1px solid #ccc; padding-bottom: 0.3rem; }
  section { margin-bottom: 1.5rem; }
  input, select { padding: 4px 6px; margin: 3px 4px 3px 0; }
  form.inline { display: inline-block; margin-right: 6px; }
  button { padding: 5px 10px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; }
  .msg { font-size: 0.9rem; margin-top: 4px; }
  .error { color: #b00; }
  .success { color: #070; }
</style>
</head>
<body>

<h1>Starfleet Academy IMS</h1>

<!-- flash messages show up here -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}
    <div class="msg {{ category }}">{{ message }}</div>
  {% endfor %}
{% endwith %}

{% block content %}{% endblock %}

</body>
</html>
